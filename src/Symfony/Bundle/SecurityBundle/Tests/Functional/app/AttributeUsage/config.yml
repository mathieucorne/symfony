imports:
    - { resource: services_test.yml }

framework:
    secret: S3CR3T
    test: true
    router:
        resource: "%kernel.project_dir%/AttributeUsage/routing.yml"
        type: yaml
    profiler:
        collect: false
    error_controller: null

security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext

    providers:
        in_memory:
            memory:
                users:
                    admin:
                        password: 'password'
                        roles: ['ROLE_ADMIN']
    firewalls:
        main:
            lazy: true
            provider: in_memory
            stateless: true
            http_basic: ~

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
